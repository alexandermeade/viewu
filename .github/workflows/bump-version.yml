name: Bump Version on Merge

on:
  push:
    branches: [main]

jobs:
  bump-version:
    # skip if the last commit was itself a bump, to avoid infinite loop
    if: "!contains(github.event.head_commit.message, 'chore: bump version')"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # use a PAT if you want this commit to trigger other workflows (e.g. release builds)
          # token: ${{ secrets.PAT_TOKEN }}

      - name: Install cargo-edit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit

      - name: Bump patch version
        run: cargo set-version --bump patch

      - name: Read new version
        id: version
        run: echo "version=$(cargo pkgid | cut -d# -f2 | cut -d: -f2)" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }} [skip ci]"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin HEAD:main
          git push --tags
