name: Build Release Binaries

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: viewu
            asset_name: viewu-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: viewu
            asset_name: viewu-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: viewu
            asset_name: viewu-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: viewu.exe
            asset_name: viewu-windows-x86_64.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} dist/${{ matrix.asset_name }}

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
